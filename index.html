<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#183c32">
<title>趙桂英｜醫學博士・健康講座講師</title>
<style>
:root {
  --deep: #173b31;
  --green: #285747;
  --gold: #d8c18a;
  --cream: #fffdf5;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 28px;
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: #e9eee7;
}
.card {
  position: relative; isolation: isolate; overflow: hidden;
  width: min(100%, 1040px); min-height: 620px; border-radius: 28px;
  display: grid; grid-template-columns: 1.25fr .75fr; align-items: center;
  padding: clamp(30px, 6vw, 76px); color: var(--cream);
  background:
    radial-gradient(ellipse at 62% 23%, rgba(255,239,180,.72) 0%, rgba(255,221,145,.28) 14%, transparent 38%),
    linear-gradient(112deg, rgba(9,35,29,.91) 0%, rgba(20,62,48,.78) 48%, rgba(15,49,39,.88) 100%),
    linear-gradient(#315c45, #142f27);
  box-shadow: 0 28px 70px rgba(24,48,37,.22);
}
/* 柔和的林間光束 */
.card::before {
  content:""; position:absolute; inset:-20%; z-index:-1; pointer-events:none;
  background:
    linear-gradient(112deg, transparent 34%, rgba(255,239,190,.20) 39%, transparent 47%),
    linear-gradient(123deg, transparent 43%, rgba(255,244,208,.14) 47%, transparent 55%),
    linear-gradient(100deg, transparent 55%, rgba(255,233,172,.13) 59%, transparent 66%);
  filter: blur(7px); transform: scale(1.08);
}
/* 遠近層次的樹影 */
.forest { position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.tree {
  position:absolute; bottom:-8%; width:0; height:0; opacity:.58;
  border-left: 90px solid transparent; border-right:90px solid transparent;
  border-bottom: 280px solid #0d2b24; filter: drop-shadow(0 0 16px rgba(0,0,0,.12));
}
.tree::before {
  content:""; position:absolute; left:-65px; top:85px; width:0; height:0;
  border-left:65px solid transparent; border-right:65px solid transparent;
  border-bottom:210px solid #12382c;
}
.tree::after {
  content:""; position:absolute; left:-3px; top:245px; width:6px; height:150px;
  background:#102d25;
}
.t1 { left:-3%; transform:scale(1.2); }
.t2 { left:10%; transform:scale(.72); opacity:.35; }
.t3 { right:4%; transform:scale(1.25); }
.t4 { right:19%; transform:scale(.7); opacity:.32; }
.glow {
  position:absolute; width:300px; height:300px; right:18%; top:-90px;
  border-radius:50%; background:rgba(255,232,174,.18); filter:blur(50px);
}
.content { position:relative; z-index:1; padding-right:24px; }
.eyebrow {
  display:flex; align-items:center; gap:12px; color:#e5d3a4;
  letter-spacing:.22em; font-size:13px; margin-bottom:34px;
}
.eyebrow::before { content:""; width:34px; height:1px; background:var(--gold); }
h1 {
  margin:0 0 13px; font-size:clamp(42px, 6vw, 66px); font-weight:600;
  letter-spacing:.12em; line-height:1.2; text-shadow:0 3px 20px rgba(0,0,0,.16);
}
.degree {
  color:#f1e5c7; font-family: Georgia, serif; font-size:clamp(17px, 2.2vw, 22px);
  letter-spacing:.13em; margin-bottom:34px;
}
.rule { width:68px; height:2px; background:var(--gold); margin-bottom:28px; }
.tagline {
  font-size:clamp(20px, 2.6vw, 27px); font-weight:500; letter-spacing:.08em;
  line-height:1.7; margin:0 0 12px;
}
.role { color:rgba(255,253,245,.78); font-size:16px; letter-spacing:.12em; }
.note {
  margin-top:52px; color:rgba(255,253,245,.55); font-size:12px;
  letter-spacing:.18em;
}
.qr-panel {
  position:relative; z-index:1; justify-self:end; width:min(100%, 270px);
  padding:17px 17px 20px; border-radius:22px;
  background:rgba(255,253,245,.96); color:#25483b;
  box-shadow:0 18px 50px rgba(0,0,0,.22); text-align:center;
}
.qr-panel img { display:block; width:100%; height:auto; border-radius:9px; }
.qr-caption { margin-top:13px; font-size:13px; letter-spacing:.14em; color:#426452; }
@media (max-width:700px) {
  body { padding:14px; }
  .card { min-height:unset; grid-template-columns:1fr; gap:30px; padding:36px 28px; border-radius:22px; }
  .content { padding:0; }
  .eyebrow { margin-bottom:23px; }
  .note { margin-top:28px; }
  .qr-panel { justify-self:start; width:190px; }
  .tree { transform:scale(.65); }
}
@media print {
  body { background:white; padding:0; }
  .card { width:100%; min-height:620px; border-radius:0; box-shadow:none; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
}
</style>
</head>
